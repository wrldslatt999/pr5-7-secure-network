services:
  server:
    build: .
    command: ["bash", "scripts/start_server.sh"]
    env_file: .env
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      BIND_HOST: 0.0.0.0
    volumes:
      - ./runtime:/app/runtime
      - ./server/certs:/app/server/certs:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    networks:
      labnet:
        ipv4_address: 172.28.57.10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 5
  client:
    build: .
    command: ["sleep", "infinity"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      SECURENET_HTTP_URL: http://server:8080
      SECURENET_HTTPS_URL: https://server:8443
      SECURENET_CA_FILE: /app/server/certs/ca.crt
      SECURENET_TOKEN_FILE: /tmp/securenet_client_session.json
    volumes:
      - ./server/certs/ca.crt:/app/server/certs/ca.crt:ro
    depends_on:
      server:
        condition: service_healthy
    networks:
      labnet:
        ipv4_address: 172.28.57.11
networks:
  labnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.57.0/24
