name: Secure Network Unit, Integration and Static Security Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m compileall -q server client tools
      - name: Required static security check (fails on findings)
        run: python tools/security_scan.py
      - name: Run security unit and real TLS integration tests
        run: python -m unittest discover -s tests -v
